{% extends 'base.html' %}{% block content %}<div class="auth-layout"><div class="auth-intro"><div class="eyebrow">CLASSROOM BOOKING</div><h1>好空间，<br>让教学更从容。</h1><p>普通用户免登录，直接预约。<br>管理员在这里编辑预约、管理校园空间。</p><div class="auth-decoration">▦</div></div><section class="panel auth-panel"><h2>管理员登录</h2><p class="muted">只有管理员使用账号，普通借用不需要注册。</p>{% if limited %}<div class="notice error">登录尝试较多，请 15 分钟后再试。</div>{% endif %}<form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="button full">登录工作空间 →</button></form><div class="auth-note">预约教室？<a href="{% url 'rooms' %}">无需登录，直接预约 ↗</a></div></section></div>{% endblock %}
