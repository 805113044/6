{% extends 'base.html' %}{% block content %}<div class="auth-layout"><div class="auth-intro"><div class="eyebrow">WELCOME TO ZHISHI</div><h1>好空间，<br>让教学更从容。</h1><p>教师登录后直接预约教室。<br>管理员在这里审批学生申请、管理校园空间。</p><div class="auth-decoration">▦</div></div><section class="panel auth-panel"><h2>教师 / 管理员登录</h2><p class="muted">账号由学校管理员创建，不开放自行注册。</p>{% if limited %}<div class="notice error">登录尝试较多，请 15 分钟后再试。</div>{% endif %}<form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="button full">登录工作空间 →</button></form><div class="auth-note">你是学生？<a href="{% url 'rooms' %}">无需登录，直接申请 ↗</a></div></section></div>{% endblock %}
