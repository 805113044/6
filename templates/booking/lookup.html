{% extends 'base.html' %}{% block content %}<div class="narrow"><div class="eyebrow">YOUR RESERVATION</div><h1>管理我的预约</h1><p class="muted">输入预约编号、学号 / 工号和本次密码；也可在课表中找到自己的名字，点击对应预约。</p><section class="panel"><form method="post" class="stack-form">{% csrf_token %}<label for="booking-id">预约编号</label><input id="booking-id" name="booking_id" type="number" min="1" required><label for="student-id">学号 / 工号</label><input id="student-id" name="student_id" maxlength="40" required autocomplete="off"><label for="booking-password">本次预约的修改密码</label><input id="booking-password" name="password" type="password" maxlength="128" required autocomplete="off"><button class="button full">验证并管理预约 →</button></form><p class="muted">每笔预约可用不同密码。忘记密码请联系管理员核实。</p></section></div>{% endblock %}
