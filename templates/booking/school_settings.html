{% extends 'base.html' %}{% block content %}<div class="narrow wide"><div class="eyebrow">SCHOOL SETTINGS</div><h1>学期与借用节次</h1><p class="muted">先设置本学期，再一键导入 Excel。普通用户仅选择节次；真实时间用于与正式课程比对。</p><section class="panel"><form method="post" class="stack-form settings-form">{% csrf_token %}{{ form.as_p }}<button class="button full">保存学期及五个节次</button></form></section><div class="tip"><p>第一、二节为上午；第三、四节为下午；第五节为晚上。“起始周数”决定开始日期所在教学周的编号。关闭借用开关只阻止新借用与重提，不撤销已有预约。起始日期或周数需要调整时，请先停用旧课表；已有未来预约的节次不能直接改钟点。</p></div></div>{% endblock %}
