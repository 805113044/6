<div class="period-cell {% if cell.free %}is-free{% elif cell.entries %}is-busy{% else %}is-closed{% endif %}"><strong>{{ cell.period }}<small>{{ cell.period.group }}</small></strong>{% for b in cell.entries %}<a class="borrower-name {% if b.kind == 'course' %}course-name{% endif %}" href="{% if b.pk %}{% url 'verify_booking' b.pk %}{% else %}{% url 'schedule' %}?date={{ day|date:'Y-m-d' }}{% endif %}">{{ b.applicant_label }}<small>{% if b.kind == 'course' %}课程占用{% else %}已借用{% endif %}</small></a>{% empty %}{% if cell.free %}<a class="slot-book" href="{% url 'room_detail' room.pk %}?date={{ day|date:'Y-m-d' }}&period={{ cell.period.pk }}">可借用 ＋</a>{% else %}<span class="calendar-free">未开放</span>{% endif %}{% endfor %}</div>
