{% extends 'base.html' %}{% block content %}<div class="narrow"><div class="eyebrow">MANAGE YOUR BOOKING</div><h1>验证本次预约</h1><p class="muted">#{{ booking.pk }} · {{ booking.room }} · 借用人：{{ booking.applicant_label }}</p><section class="panel"><form method="post" class="stack-form">{% csrf_token %}<label for="student-id">学号 / 工号</label><input id="student-id" name="student_id" maxlength="40" required autocomplete="off"><label for="booking-password">本次预约的修改密码</label><input id="booking-password" name="password" type="password" maxlength="128" required autocomplete="off"><button class="button full">验证并查看 / 修改 →</button></form><p class="muted">验证仅对这笔预约有效，15 分钟后需重新验证。忘记密码请联系管理员核实处理。</p></section>{% if booking.kind == 'course' %}<p class="muted">正式课程只能由管理员编辑。</p>{% endif %}</div>{% endblock %}
