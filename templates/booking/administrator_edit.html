{% extends 'base.html' %}{% block content %}<div class="narrow"><a class="back-link" href="{% url 'administrators' %}">← 管理员账号</a><h1>{% if account %}编辑管理员{% else %}创建管理员{% endif %}</h1><p class="muted">{% if account %}登录账号：{{ account.username }}。停用后不能登录，修改密码会使原登录会话失效。{% else %}创建后即可进入统一管理中心，无需共享账号。{% endif %}</p><section class="panel"><form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<button class="button full">保存管理员账号</button></form></section></div>{% endblock %}
